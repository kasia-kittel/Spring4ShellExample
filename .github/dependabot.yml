version: 2
updates:
  # Scan Dockerfiles for base image vulnerabilities
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

    allow:
      - dependency-name: '*'
        update-types:
          - "version-update:semver-patch"
    
  # Scan Java dependencies (Maven)
  - package-ecosystem: "maven"
    directory: "/test-app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
